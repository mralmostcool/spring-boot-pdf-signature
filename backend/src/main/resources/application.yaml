spring:
  application:
    name: pdf-signature-service

  datasource:
    url: jdbc:postgresql://localhost:5432/pdf_signature
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  pageTitle: PDF Signature API